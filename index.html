<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ماشین حساب سیدمحمد</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  :root {
    --bg-dark: #070d19;
    --bg-card: #101c36;
    --gold-metallic: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
    --gold-solid: #d4af37;
    --text-main: #ffffff;
    --text-muted: #8892b0;
    --btn-dark: #1a2a4d;
    --btn-active: #23376a;
  }

  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    font-family: 'Vazirmatn', Tahoma, sans-serif; 
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  /* جلوگیری از تاخیر ۳۰۰ میلی‌ثانیه‌ای لمس در موبایل */
  body, button {
    touch-action: manipulation;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-dark);
    background-image: radial-gradient(circle at 50% 0%, #172a54 0%, #070d19 80%);
    padding: 20px;
    overflow: hidden;
  }

  .calculator {
    width: min(380px, 100%);
    background: var(--bg-card);
    border-radius: 36px;
    padding: 24px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 0 2px rgba(212, 175, 55, 0.2);
    position: relative;
    z-index: 1;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin-bottom: 25px;
  }

  .logo-container {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
    box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
  }

  .logo-container img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .title-box {
    text-align: right;
  }

  .title-box h1 {
    font-size: 1.05rem;
    color: var(--text-main);
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .title-box p {
    font-size: 0.85rem;
    color: var(--gold-solid);
    font-weight: 700;
    margin-top: 2px;
  }

  .display-container {
    background: #0a1226;
    border-radius: 24px;
    padding: 20px;
    margin-bottom: 24px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    min-height: 120px;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  .history {
    font-size: 1rem;
    color: var(--text-muted);
    text-align: left;
    min-height: 24px;
    direction: ltr;
    margin-bottom: 5px;
  }

  .current {
    font-size: 3.2rem;
    color: var(--text-main);
    text-align: left;
    direction: ltr;
    font-weight: 500;
    line-height: 1.1;
    word-break: break-all;
    font-variant-numeric: tabular-nums;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  button {
    border: none;
    border-radius: 18px;
    font-size: 1.5rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 68px;
    background: var(--btn-dark);
    color: var(--text-main);
    /* استفاده از ترنزیشن‌های سخت‌افزاری برای روانی */
    transition: background 0.1s, transform 0.1s;
    will-change: transform;
  }

  /* حالت فشرده شدن با لمس (pointerdown) */
  button:active {
    background: var(--btn-active) !important;
    transform: scale(0.92);
  }

  .operator {
    color: var(--gold-solid);
    font-size: 1.8rem;
  }
  
  .operator:active {
    color: #fff;
  }

  .equals {
    background: var(--gold-metallic);
    color: #0d1b3e;
    grid-row: span 2;
    height: 100%;
    font-size: 2rem;
    font-weight: 800;
  }

  .equals:active {
    transform: scale(0.95);
    filter: brightness(1.2);
  }

  .clear, .backspace {
    color: #ff6b6b;
  }

  .clear {
    font-size: 1.2rem;
    font-weight: 800;
  }

  .zero {
    grid-column: span 2;
  }
</style>
</head>
<body>

  <div class="calculator">
    
    <div class="header">
      <div class="logo-container">
        <img src="logo.png" alt="RM" onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg';">
      </div>
      <div class="title-box">
        <h1>سیدمحمد موسوی متین</h1>
        <p>عشق یعنی رئال مادرید</p>
      </div>
    </div>

    <div class="display-container">
      <div class="history" id="history"></div>
      <div class="current" id="display">0</div>
    </div>

    <div class="buttons" id="buttons">
      <button class="clear" data-action="clear">C</button>
      <button class="backspace" data-action="backspace">⌫</button>
      <button class="operator" data-op="/">÷</button>
      <button class="operator" data-op="*">×</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button class="operator" data-op="-">−</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button class="operator" data-op="+">+</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button class="equals" data-action="equals">=</button>

      <button data-num="0" class="zero">0</button>
      <button data-num=".">.</button>
    </div>

  </div>

<script>
  const displayEl = document.getElementById('display');
  const historyEl = document.getElementById('history');
  const buttons = document.getElementById('buttons');

  let current   = '0';
  let previous  = null;
  let operator  = null;
  let resetNext = false;

  const opSymbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };

  // --- سیستم صدای فوق سریع (بدون ایجاد تاخیر) ---
  let audioCtx;
  const sounds = {};

  // پیش‌ساخت صداها برای اجرای فوری
  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    // ساخت صداهای کوتاه
    const createBuffer = (freq, duration) => {
      const sampleRate = audioCtx.sampleRate;
      const buffer = audioCtx.createBuffer(1, sampleRate * duration, sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < buffer.length; i++) {
        data[i] = Math.sin(2 * Math.PI * freq * (i / sampleRate)) * Math.exp(-5 * (i / sampleRate));
      }
      return buffer;
    };

    sounds.num = createBuffer(800, 0.05);
    sounds.op  = createBuffer(500, 0.08);
    sounds.eq  = createBuffer(1000, 0.1);
    sounds.clr = createBuffer(300, 0.08);
  }

  function playSound(type) {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const source = audioCtx.createBufferSource();
    source.buffer = sounds[type];
    source.connect(audioCtx.destination);
    source.start();
  }
  // ------------------------------------------------

  function updateDisplay() {
    let formatted = current;
    if (current !== 'خطا' && !current.includes('e')) {
        let parts = current.split('.');
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        formatted = parts.join('.');
    }
    displayEl.textContent = formatted;

    if (operator && previous !== null) {
      historyEl.textContent = `${previous} ${opSymbols[operator]}`;
    } else {
      historyEl.textContent = '';
    }
  }

  function inputNumber(num) {
    if (resetNext) {
      current = num;
      resetNext = false;
    } else if (num === '.') {
      if (!current.includes('.')) current += '.';
    } else {
      current = current === '0' ? num : current + num;
    }
    updateDisplay();
  }

  function setOperator(op) {
    if (operator !== null && !resetNext) compute();
    previous  = parseFloat(current);
    operator  = op;
    resetNext = true;
    updateDisplay();
  }

  function compute() {
    if (operator === null || previous === null) return;

    const curr = parseFloat(current);
    let result;

    switch (operator) {
      case '+': result = previous + curr; break;
      case '-': result = previous - curr; break;
      case '*': result = previous * curr; break;
      case '/':
        if (curr === 0) {
          current = 'خطا';
          previous = null; operator = null; resetNext = true;
          updateDisplay();
          return;
        }
        result = previous / curr;
        break;
    }

    current   = String(Math.round(result * 1e10) / 1e10);
    previous  = null;
    operator  = null;
    resetNext = true;
    updateDisplay();
  }

  function backspace() {
    if (resetNext || current === 'خطا') return;
    current = current.slice(0, -1);
    if (current === '' || current === '-') current = '0';
    updateDisplay();
  }

  function clearAll() {
    current = '0';
    previous = null;
    operator = null;
    resetNext = false;
    updateDisplay();
  }

  // استفاده از pointerdown به جای click برای واکنش فوری در لمس
  buttons.addEventListener('pointerdown', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;

    // فعالسازی صدا در اولین لمس (قانون مرورگرها)
    if (!audioCtx) initAudio();

    if (btn.dataset.num !== undefined) {
        playSound('num');
        inputNumber(btn.dataset.num);
    } 
    else if (btn.dataset.op) {
        playSound('op');
        setOperator(btn.dataset.op);
    } 
    else if (btn.dataset.action === 'equals') {
        playSound('eq');
        compute();
    } 
    else if (btn.dataset.action === 'clear' || btn.dataset.action === 'backspace') {
        playSound('clr');
        if (btn.dataset.action === 'clear') clearAll();
        else backspace();
    }
  });

  // پشتیبانی از کیبورد
  document.addEventListener('keydown', (e) => {
    const k = e.key;
    if (/^[0-9.]$/.test(k)) { if (!audioCtx) initAudio(); playSound('num'); inputNumber(k); }
    else if (['+','-','*','/'].includes(k)) { if (!audioCtx) initAudio(); playSound('op'); setOperator(k); }
    else if (k === 'Enter' || k === '=') { e.preventDefault(); if (!audioCtx) initAudio(); playSound('eq'); compute(); }
    else if (k === 'Backspace') { if (!audioCtx) initAudio(); playSound('clr'); backspace(); }
    else if (k === 'Escape') { if (!audioCtx) initAudio(); playSound('clr'); clearAll(); }
  });
</script>

</body>
</html>
