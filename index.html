<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ماشین حساب سیدمحمد</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  :root {
    --bg-dark: #0b132b;
    --bg-card: #121e3d;
    --gold: #d4af37;
    --text-main: #ffffff;
    --text-muted: #8892b0;
    --btn-dark: #1c2d54;
    --btn-active: #2a4275;
    --danger: #ff6b6b;
  }

  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    font-family: 'Vazirmatn', Tahoma, sans-serif; 
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-dark);
    padding: 20px;
    overflow: hidden;
    transform: translateZ(0);
  }

  .calculator {
    width: min(380px, 100%);
    background: var(--bg-card);
    border-radius: 30px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    border: 2px solid var(--gold);
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin-bottom: 20px;
  }

  .logo-container {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 5px;
  }

  .logo-container img { width: 100%; height: 100%; object-fit: contain; }

  .title-box { text-align: right; }
  .title-box h1 { font-size: 1rem; color: var(--text-main); font-weight: 800; }
  .title-box p { font-size: 0.8rem; color: var(--gold); font-weight: 700; margin-top: 2px; }

  .display-container {
    background: #060c19;
    border-radius: 20px;
    padding: 15px;
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    min-height: 110px;
    border: 1px solid #223;
  }

  .history {
    font-size: 0.9rem;
    color: var(--text-muted);
    text-align: left;
    min-height: 22px;
    direction: ltr;
    margin-bottom: 5px;
  }

  .current {
    font-size: 3rem;
    color: var(--text-main);
    text-align: left;
    direction: ltr;
    font-weight: 500;
    line-height: 1.1;
    word-break: break-all;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button {
    border: none;
    border-radius: 15px;
    font-size: 1.5rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 65px;
    background: var(--btn-dark);
    color: var(--text-main);
    transition: background 0.1s, transform 0.1s;
    will-change: transform;
    transform: translateZ(0);
  }

  button:active {
    background: var(--btn-active);
    transform: scale(0.92) translateZ(0);
  }

  .operator { color: var(--gold); font-size: 1.8rem; }
  .operator:active { color: #fff; }

  .equals {
    background: var(--gold);
    color: #0b132b;
    grid-row: span 2;
    height: 100%;
    font-size: 2rem;
    font-weight: 800;
  }
  .equals:active { background: #e5c158; }

  .clear, .backspace { color: var(--danger); font-weight: 800; }
  .zero { grid-column: span 2; }
</style>
</head>
<body>

  <div class="calculator">
    
    <div class="header">
      <div class="logo-container">
        <img src="logo.png" alt="RM" onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg';">
      </div>
      <div class="title-box">
        <h1>سیدمحمد موسوی متین</h1>
        <p>عشق یعنی رئال مادرید</p>
      </div>
    </div>

    <div class="display-container">
      <div class="history" id="history"></div>
      <div class="current" id="display">0</div>
    </div>

    <div class="buttons" id="buttons">
      <button class="clear" data-action="clear">C</button>
      <button class="backspace" data-action="backspace">⌫</button>
      <button class="operator" data-op="/">÷</button>
      <button class="operator" data-op="*">×</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button class="operator" data-op="-">−</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button class="operator" data-op="+">+</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button class="equals" data-action="equals">=</button>

      <button data-num="0" class="zero">0</button>
      <button data-num=".">.</button>
    </div>

  </div>

<script>
  const displayEl = document.getElementById('display');
  const historyEl = document.getElementById('history');
  const buttons = document.getElementById('buttons');

  let current   = '0';
  let previous  = null;
  let operator  = null;
  let resetNext = false;

  const opSymbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };

  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playBeep(freq) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'sine';
    osc.frequency.value = freq;
    
    // صدای بسیار ملایم (از 0.1 به 0.02 کاهش یافت تا گوش خراش نباشد)
    gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
  }

  function updateDisplay() {
    let formatted = current;
    if (current !== 'خطا' && !current.includes('e')) {
        let parts = current.split('.');
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        formatted = parts.join('.');
    }
    displayEl.textContent = formatted;

    if (operator && previous !== null) {
      historyEl.textContent = `${previous} ${opSymbols[operator]}`;
    } else {
      historyEl.textContent = '';
    }
  }

  function inputNumber(num) {
    if (resetNext) {
      current = num;
      resetNext = false;
    } else if (num === '.') {
      if (!current.includes('.')) current += '.';
    } else {
      current = current === '0' ? num : current + num;
    }
    updateDisplay();
  }

  function setOperator(op) {
    if (operator !== null && !resetNext) compute();
    previous  = parseFloat(current);
    operator  = op;
    resetNext = true;
    updateDisplay();
  }

  function compute() {
    if (operator === null || previous === null) return;

    const curr = parseFloat(current);
    let result;

    switch (operator) {
      case '+': result = previous + curr; break;
      case '-': result = previous - curr; break;
      case '*': result = previous * curr; break;
      case '/':
        if (curr === 0) {
          current = 'خطا';
          previous = null; operator = null; resetNext = true;
          updateDisplay();
          return;
        }
        result = previous / curr;
        break;
    }

    current   = String(Math.round(result * 1e10) / 1e10);
    previous  = null;
    operator  = null;
    resetNext = true;
    updateDisplay();
  }

  function backspace() {
    // حذف شرط resetNext برای اینکه دکمه حذف همیشه کار کند
    if (current === 'خطا') return;
    current = current.slice(0, -1);
    if (current === '' || current === '-') current = '0';
    resetNext = false; // اجازه می‌دهیم بعد از حذف، عدد جدید وارد شود
    updateDisplay();
  }

  function clearAll() {
    current = '0';
    previous = null;
    operator = null;
    resetNext = false;
    updateDisplay();
  }

  // استفاده از pointerdown برای واکنش صفر میلی‌ثانیه‌ای
  buttons.addEventListener('pointerdown', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    
    e.preventDefault(); 

    if (!audioCtx) initAudio();

    if (btn.dataset.num !== undefined) {
        playBeep(800);
        inputNumber(btn.dataset.num);
    } 
    else if (btn.dataset.op) {
        playBeep(500);
        setOperator(btn.dataset.op);
    } 
    else if (btn.dataset.action === 'equals') {
        playBeep(1000);
        compute();
    } 
    else if (btn.dataset.action === 'clear' || btn.dataset.action === 'backspace') {
        playBeep(300);
        if (btn.dataset.action === 'clear') clearAll();
        else backspace();
    }
  });

  // کیبورد
  document.addEventListener('keydown', (e) => {
    const k = e.key;
    if (/^[0-9.]$/.test(k)) { if (!audioCtx) initAudio(); playBeep(800); inputNumber(k); }
    else if (['+','-','*','/'].includes(k)) { if (!audioCtx) initAudio(); playBeep(500); setOperator(k); }
    else if (k === 'Enter' || k === '=') { e.preventDefault(); if (!audioCtx) initAudio(); playBeep(1000); compute(); }
    else if (k === 'Backspace') { if (!audioCtx) initAudio(); playBeep(300); backspace(); }
    else if (k === 'Escape') { if (!audioCtx) initAudio(); playBeep(300); clearAll(); }
  });
</script>

</body>
</html>
